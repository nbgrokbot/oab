<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>ADVbot OAB · flipcards</title>
<style>
  :root{
    --bg:#f3f4f8; --card:#ffffff; --ink:#14161c; --muted:#5d6372; --line:#e2e5ee;
    --accent:#2f5bff; --accent-ink:#ffffff; --opt:#f6f7fb; --opt-hover:#eceffa;
    --ok:#12a150; --ok-bg:#e5f7ec; --bad:#d93a3a; --bad-bg:#fdeaea; --chip:#e8edff; --chip-ink:#2440b8;
    --shadow:0 6px 24px rgba(20,22,28,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1015; --card:#181b22; --ink:#eef0f5; --muted:#9aa1b2; --line:#2a2f3a;
      --accent:#6c8cff; --accent-ink:#0e1015; --opt:#20242d; --opt-hover:#272c37;
      --ok:#3ccf7a; --ok-bg:#12301f; --bad:#ff6b6b; --bad-bg:#3a1717; --chip:#222a45; --chip-ink:#a9b8ff;
      --shadow:0 6px 24px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 10px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .date{color:var(--muted);font-size:14px;text-align:right}
  .score{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 2px 10px;display:flex;align-items:center;gap:10px}
  .dots{display:flex;gap:6px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  .score b{font-size:15px} .score span{color:var(--muted);font-size:14px}
  .card{perspective:1400px;margin:0 0 18px}
  .inner{display:grid;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{grid-area:1/1;background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);
    padding:18px 16px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .back{transform:rotateY(180deg)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .chip{display:inline-block;background:var(--chip);color:var(--chip-ink);font-weight:600;font-size:13px;padding:4px 10px;border-radius:999px}
  .num{color:var(--muted);font-size:13px;font-weight:600}
  .q{font-size:17px;font-weight:500;margin:4px 0 14px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;
    background:var(--opt);border:2px solid transparent;border-radius:14px;padding:13px 12px;margin:0 0 10px;min-height:54px;cursor:pointer}
  .opt:active{background:var(--opt-hover)}
  .opt .l{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;
    background:var(--card);border:1.5px solid var(--line);text-transform:lowercase}
  .opt .t{padding-top:3px;font-size:16px}
  .opt[disabled]{cursor:default}
  .opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
  .verdict{font-size:22px;font-weight:800;margin:2px 0 8px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .ans{border-radius:14px;padding:12px;background:var(--ok-bg);border:2px solid var(--ok);margin:0 0 10px;font-size:16px}
  .ans.mine{background:var(--bad-bg);border-color:var(--bad)}
  .ans small{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .exp{font-size:16px;margin:12px 0}
  .exp p{margin:4px 0 8px}
  .exp .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .q{white-space:pre-line}
  .meta{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
  .meta div{margin:2px 0}
  .btn{display:block;width:100%;margin-top:14px;font:inherit;font-weight:600;font-size:16px;padding:13px;border-radius:14px;
    border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:50px}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
  .hint{color:var(--muted);font-size:13px;margin:-2px 0 0;text-align:center}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:24px 18px;text-align:center;color:var(--muted)}
  details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-top:8px}
  summary{font-weight:600;padding:12px 0;cursor:pointer;min-height:44px}
  .days a{display:flex;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;min-height:44px}
  .days a.cur{color:var(--accent);font-weight:700}
  .days a span:last-child{color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
  .toast.show{opacity:.92}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>OAB · 1ª fase</h1><div class="date" id="date"></div></header>
  <div id="who" class="empty" style="display:none;margin-bottom:14px"></div>
  <div class="score" id="score"></div>
  <div id="cards"></div>
  <details id="arch"><summary>Dias anteriores</summary><div class="days" id="days"></div></details>
  <footer>Questões oficiais da FGV (Exame de Ordem Unificado) com gabarito oficial · <span id="quem"></span> · <a href="#" id="trocar" style="color:inherit">trocar pessoa</a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbx70r3PYtdaPYDTHlL5Np-VE69CZ5pI7nT2kMsHiqYr1N0mAoEAeAXRmFvmSfSJ5rk/exec';
var Q = new URLSearchParams(location.search);
var DATA = {data: (/^\d{4}-\d{2}-\d{2}$/.test(Q.get('d')||'') ? Q.get('d') : ''), usuario: '', cards: [], respostas: {}, dias: [], baseUrl: location.origin + location.pathname};
(function(){
  function slug(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24).replace(/^nb$/, 'nelson');
  }
  function mostrarErro(msg){ var w = document.getElementById('who'); w.style.display = 'block'; w.textContent = msg; }
  function carregar(u){
    var w = document.getElementById('who'); w.style.display = 'block'; w.textContent = 'Carregando os cartões…';
    var url = API + '?api=dados&u=' + encodeURIComponent(u) + (DATA.data ? '&d=' + DATA.data : '');
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if (!d || d.ok === false) throw new Error(d && d.erro);
      d.baseUrl = location.origin + location.pathname; DATA = d;
      w.style.display = 'none'; w.innerHTML = '';
      document.getElementById('score').style.display = '';
      document.getElementById('cards').style.display = '';
      iniciar();
    }).catch(function(){ mostrarErro('Não consegui carregar os cartões. Verifique a conexão e recarregue a página.'); });
  }
  var salvo = '';
  try { salvo = slug(localStorage.getItem('oab_user') || ''); } catch (e) {}
  if (DATA.usuario){ try { localStorage.setItem('oab_user', DATA.usuario); } catch (e) {} iniciar(); return; }
  document.getElementById('score').style.display = 'none';
  document.getElementById('cards').style.display = 'none';
  if (salvo){ carregar(salvo); return; }
  var who = document.getElementById('who'); who.style.display = 'block';
  who.appendChild(document.createTextNode('Antes de responder, diga quem é você. Cada pessoa tem a própria aba de respostas.'));
  var f = document.createElement('form'); f.style.marginTop = '12px';
  var inp = document.createElement('input'); inp.placeholder = 'Seu nome'; inp.maxLength = 24; inp.required = true;
  inp.style.cssText = 'width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--opt);color:inherit';
  var go = document.createElement('button'); go.className = 'btn'; go.textContent = 'Entrar'; go.type = 'submit';
  f.appendChild(inp); f.appendChild(go); who.appendChild(f);
  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    var u = slug(inp.value); if (!u) return;
    try { localStorage.setItem('oab_user', u); } catch (e) {}
    carregar(u);
  });
  return;

function iniciar(){
  var L = ['a','b','c','d'];
  var state = {}; // n -> escolhida
  Object.keys(DATA.respostas || {}).forEach(function(k){ state[k] = DATA.respostas[k]; });
  var DOW = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  var MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function fmt(iso, longo){
    var p = iso.split('-'), dt = new Date(Date.UTC(+p[0], +p[1]-1, +p[2], 12));
    var s = (+p[2]) + ' ' + MON[+p[1]-1] + ' ' + p[0];
    return longo ? DOW[dt.getUTCDay()] + ', ' + s : s;
  }
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function link(d){ return (DATA.baseUrl || '') + '?d=' + d; }
  function linkar(box, txt){
    String(txt || '').split(/(https?:\/\/[^\s)]+)/).forEach(function(p){
      if (/^https?:\/\//.test(p)){ var a = document.createElement('a'); a.href = p; a.textContent = p.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48) + (p.length > 60 ? '…' : ''); a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'inherit'; box.appendChild(a); }
      else box.appendChild(document.createTextNode(p));
    });
    return box;
  }
  function bloco(titulo, txt){
    var b = el('div','exp'); b.appendChild(el('small','lbl', titulo));
    String(txt || '').split(/\n+/).forEach(function(par){ if (!par.trim()) return; var p = el('p', null); linkar(p, par); b.appendChild(p); });
    return b;
  }
  function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2600); }

  document.getElementById('date').textContent = (DATA.data === DATA.hoje ? 'Hoje · ' : '') + fmt(DATA.data, true);
  document.getElementById('quem').textContent = DATA.usuario;

  function renderScore(){
    var box = document.getElementById('score'); box.innerHTML = '';
    var dots = el('div','dots'), feitas = 0, ok = 0;
    DATA.cards.forEach(function(c){
      var s = state[c.n], d = el('div','dot');
      if (s){ feitas++; if (s === c.correta){ ok++; d.className += ' ok'; } else d.className += ' bad'; }
      dots.appendChild(d);
    });
    box.appendChild(dots);
    box.appendChild(el('b', null, ok + ' de ' + DATA.cards.length + ' certas'));
    box.appendChild(el('span', null, feitas < DATA.cards.length ? '· ' + (DATA.cards.length - feitas) + ' por responder' : '· dia concluído'));
  }

  function card(c){
    var wrap = el('div','card'); wrap.id = 'card-' + c.n;
    var inner = el('div','inner'); wrap.appendChild(inner);
    var front = el('div','face front'), back = el('div','face back');
    inner.appendChild(front); inner.appendChild(back);

    var top = el('div','top'); top.appendChild(el('span','chip', c.disciplina));
    top.appendChild(el('span','num', c.n + '/' + DATA.cards.length)); front.appendChild(top);
    front.appendChild(el('div','q', c.pergunta));
    var btns = {};
    L.forEach(function(k){
      var b = el('button','opt'); b.type = 'button';
      b.appendChild(el('span','l', k)); b.appendChild(el('span','t', c.opcoes[k]));
      b.addEventListener('click', function(){ escolher(c, k); });
      btns[k] = b; front.appendChild(b);
    });
    var again = el('button','btn ghost','Ver resposta'); again.style.display = 'none';
    again.addEventListener('click', function(){ wrap.classList.add('flipped'); });
    front.appendChild(again);
    front.appendChild(el('p','hint','Toque numa alternativa para virar o cartão'));

    function pintar(){
      var s = state[c.n]; if (!s) return;
      L.forEach(function(k){
        btns[k].disabled = true;
        if (k === c.correta) btns[k].classList.add('right');
        else if (k === s) btns[k].classList.add('wrong');
      });
      again.style.display = 'block'; front.querySelector('.hint').style.display = 'none';
      back.innerHTML = '';
      var acertou = s === c.correta;
      var top2 = el('div','top'); top2.appendChild(el('span','chip', c.disciplina)); top2.appendChild(el('span','num', c.n + '/' + DATA.cards.length));
      back.appendChild(top2);
      back.appendChild(el('div','verdict ' + (acertou ? 'ok' : 'bad'), acertou ? '✓ Acertou!' : '✗ Não foi dessa vez'));
      var a = el('div','ans'); a.appendChild(el('small', null, 'Resposta correta: ' + c.correta));
      a.appendChild(document.createTextNode(c.opcoes[c.correta])); back.appendChild(a);
      if (!acertou){ var m = el('div','ans mine'); m.appendChild(el('small', null, 'Você marcou: ' + s)); m.appendChild(document.createTextNode(c.opcoes[s])); back.appendChild(m); }
      back.appendChild(bloco('Por quê', c.justificativa));
      if (c.pegadinha) back.appendChild(bloco('Pegadinha', c.pegadinha));
      if (c.base) back.appendChild(bloco('Base legal', c.base));
      var meta = el('div','meta');
      meta.appendChild(el('div', null, 'Disciplina: ' + c.disciplina + (c.tema ? ' · ' + c.tema : '')));
      if (c.fonte) { var fd = el('div', null); fd.appendChild(document.createTextNode('Fonte: ')); linkar(fd, c.fonte); meta.appendChild(fd); }
      back.appendChild(meta);
      var vb = el('button','btn','Ver a pergunta'); vb.addEventListener('click', function(){ wrap.classList.remove('flipped'); });
      back.appendChild(vb);
    }
    wrap._pintar = pintar;
    pintar();
    return wrap;
  }

  function escolher(c, k){
    if (state[c.n]) return;
    state[c.n] = k;
    var w = document.getElementById('card-' + c.n); w._pintar(); renderScore();
    setTimeout(function(){ w.classList.add('flipped'); }, 380);
    var ru = API + '?api=registrar&u=' + encodeURIComponent(DATA.usuario) + '&d=' + DATA.data + '&n=' + c.n + '&e=' + k;
    fetch(ru).then(function(r){ return r.json(); }).then(function(x){ if (!x || x.ok === false) throw 0; })
      .catch(function(){ toast('Resposta não foi salva (sem conexão?)'); });
  }

  var box = document.getElementById('cards');
  if (!DATA.cards.length){
    var e = el('div','empty');
    e.appendChild(el('div', null, DATA.data === DATA.hoje ? 'Os cartões de hoje ainda não chegaram. Eles saem às 9h (horário de Brasília).' : 'Não há cartões neste dia.'));
    box.appendChild(e);
  } else DATA.cards.forEach(function(c){ box.appendChild(card(c)); });
  renderScore();

  var days = document.getElementById('days');
  if (DATA.data !== DATA.hoje){ var h = el('a', null); h.href = DATA.baseUrl || '?'; h.appendChild(el('span', null, '← Hoje')); h.appendChild(el('span', null, fmt(DATA.hoje))); days.appendChild(h); }
  (DATA.dias || []).forEach(function(d){
    var a = el('a', d.data === DATA.data ? 'cur' : null); a.href = link(d.data);
    a.appendChild(el('span', null, fmt(d.data, true)));
    a.appendChild(el('span', null, d.feitas ? d.acertos + '/' + d.total + ' certas' : d.total + ' cartões'));
    days.appendChild(a);
  });
  if (!(DATA.dias || []).length) document.getElementById('arch').style.display = 'none';
}
})();
</script>
<script>document.getElementById('trocar').addEventListener('click',function(e){e.preventDefault();try{localStorage.removeItem('oab_user')}catch(x){}location.reload();});</script>
</body>
</html>
